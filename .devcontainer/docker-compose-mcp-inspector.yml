services:
  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    networks:
      - gas
    ports:
    - "6274:6274"
    - "6277:6277"
    depends_on:
      - gas
    environment:
      - DANGEROUSLY_OMIT_AUTH=true
      - HOST=0.0.0.0
      - DANGEROUSLY_DISABLE_ORIGIN_CHECK=true
      - DEBUG=true

networks:
  gas:
    external: true
